<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقعي الأول</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #007bff; }
    </style>
</head>
<body>

    <div class="box">
        <h1>أهلاً بك في موقعي!</h1>
        <p>هذه أول صفحة ويب أنشئها بنفسي.</p>
    </div>

</body>
</html>
